{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<h1>Add Product</h1>

<form method="post">
    {% csrf_token %}

    <label>Name:</label>
<input type="text" name="name">

<label>Brand:</label>
<input type="text" name="brand">

<label>Size:</label>
<input type="text" name="size">

<label>Color:</label>
<input type="text" name="color">

<label>Price:</label>
<input type="number" name="price" step="0.01">

<button type="submit">Add Product</button>

</form>

{% endblock %}
